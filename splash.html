<title>Fotoshop – Loading</title>
<style>
:root{--a:#4aa8ff;--bg:#050b16;box-sizing:border-box;color-scheme:dark}
html,body{margin:0;height:100%;-webkit-app-region:drag;user-select:none;display:grid;place-items:center;background:var(--bg);overflow:hidden;font-family:"Bahnschrift","Arial Narrow",system-ui,sans-serif;color:#cfe6ff}
.scr{position:relative;width:min(100vw,545px);max-height:100%;aspect-ratio:545/612;overflow:hidden;display:grid;place-items:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:radial-gradient(ellipse at 50% 42%,#0c2240 0,var(--bg) 70%)}
.grid{position:absolute;inset:0;background:linear-gradient(rgba(74,168,255,.05) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(74,168,255,.05) 1px,transparent 1px) 0 0/48px 48px;mask:radial-gradient(circle at 50% 45%,#000,transparent 70%);-webkit-mask:radial-gradient(circle at 50% 45%,#000,transparent 70%)}
.wrap{position:relative;width:52%;aspect-ratio:1;margin-top:-9%}
.logo{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain}
.main{animation:rev 1.1s cubic-bezier(.7,0,.2,1) both,pulse 2.8s ease-in-out 1.3s infinite}
@keyframes rev{0%{clip-path:polygon(0 0,0 0,-30% 100%,-30% 100%);filter:brightness(3);transform:scale(1.18)}
60%{filter:brightness(2.2)}100%{clip-path:polygon(0 0,160% 0,130% 100%,-30% 100%);filter:brightness(1);transform:scale(1)}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 6px rgba(74,168,255,.25))}50%{filter:drop-shadow(0 0 26px rgba(74,168,255,.8))}}
.g{mix-blend-mode:screen;opacity:0;animation:gl 4.4s steps(1) 1s infinite}
.g1{filter:hue-rotate(-40deg) saturate(3)}.g2{filter:hue-rotate(60deg) saturate(3)}
@keyframes gl{0%{opacity:.9;clip-path:inset(12% 0 70% 0);transform:translateX(-8px)}3%{opacity:.9;clip-path:inset(55% 0 25% 0);transform:translateX(9px)}6%{opacity:.9;clip-path:inset(80% 0 4% 0);transform:translateX(-5px)}9%,100%{opacity:0}}
.g2{animation-delay:1.05s}
.sweep{position:absolute;inset:-4%;overflow:hidden;border-radius:18%;pointer-events:none}
.sweep::after{content:"";position:absolute;top:-10%;bottom:-10%;width:22%;left:-40%;background:linear-gradient(100deg,transparent,rgba(190,230,255,.75),transparent);transform:skewX(-20deg);animation:sw 4.4s ease-in-out 1.2s infinite}
@keyframes sw{0%{left:-40%}22%,100%{left:140%}}
svg.fr{position:absolute;inset:-14%;width:128%;height:128%;overflow:visible}
.fr path{fill:none;stroke:var(--a);stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;animation:dr .9s ease-out .5s forwards;filter:drop-shadow(0 0 5px var(--a))}
@keyframes dr{to{stroke-dashoffset:0}}
.ring{position:absolute;inset:-22%;width:144%;height:144%;opacity:0;animation:fi .6s ease 1.2s forwards}
.ring circle{fill:none;stroke:var(--a);stroke-width:1.5;stroke-dasharray:40 120 8 60;transform-origin:50% 50%;animation:sp 6s linear infinite}
.ring circle+circle{stroke-dasharray:3 17;opacity:.5;animation-duration:14s;animation-direction:reverse}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes fi{to{opacity:1}}
.ui{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);width:76%;opacity:0;animation:fi .6s ease 1.4s forwards}
.row{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:8px;color:#8fbfef}
.bar{height:3px;background:rgba(74,168,255,.18);position:relative;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.bar i{position:absolute;inset:0;width:0;background:var(--a);box-shadow:0 0 12px var(--a)}
.tip{margin-top:10px;font-size:11px;letter-spacing:.2em;color:#5d86b3;text-transform:uppercase}
button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;font:inherit;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#8fbfef;background:transparent;border:1px solid #2b5b8e;padding:7px 14px;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);pointer-events:none}
@media (prefers-reduced-motion:reduce){.g,.sweep::after,.ring circle{animation:none}}
</style></head><body>

const f=document.getElementById('f'),p=document.getElementById('p'),t=document.getElementById('t'),l=document.getElementById('l');
const msg=['Menyiapkan kanvas…','Memuat kuas dan lapisan…','Menyalakan filter…','Hampir siap…'];
let t0=0,pr=0,fin=false;
/* dipanggil dari main.js saat aplikasi siap: progres langsung dituntaskan */
window.setStatus=function(text,kind){fin=true;if(text)t.textContent=text;if(l)l.textContent=kind=='warn'?'Perhatian':'Siap'};
function loop(n){if(!t0)t0=n;
 if(fin)pr+=(1-pr)*0.16;                                         /* tuntas cepat saat status akhir */
 else{const k=Math.min(1,Math.max(0,(n-t0-1200)/3200));pr=0.92*(1-Math.pow(1-k,2.2))}   /* naik halus, berhenti di 92% sampai aplikasi siap */
 f.style.width=pr*100+'%';p.textContent=Math.round(pr*100)+'%';
 if(!fin)t.textContent=msg[Math.min(3,Math.floor(pr/0.92*3.99))];
 if(!(fin&&pr>0.999))requestAnimationFrame(loop);else{f.style.width='100%';p.textContent='100%'}}
requestAnimationFrame(loop);
</script></body></html>

<!DOCTYPE html>
<!--SPLASH_VERSION=1-->
<html lang="id"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-app-region:drag}
.card{position:absolute;inset:0;border-radius:14px;overflow:hidden;background:#a8d0ff;animation:in .7s cubic-bezier(.2,.8,.2,1) both;isolation:isolate}

/* ===== Gambar splash: terus bergerak (kamera melayang + napas cahaya) ===== */
.bg{position:absolute;inset:0;background:url(assets/splash.jpg) center/100% 100% no-repeat;
    transform-origin:0% 50%;will-change:transform,filter;
    animation:kenburns 16s ease-in-out infinite alternate, breathe 4.5s ease-in-out infinite}
@keyframes kenburns{
  0%  {transform:scale(1.03) translate3d(0, 1.2%,0)}
  50% {transform:scale(1.07) translate3d(-.3%,-.2%,0)}
  100%{transform:scale(1.11) translate3d(-.6%,-1.4%,0)}
}
@keyframes breathe{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.1) saturate(1.2)}}

/* Cahaya energi biru yang berdenyut di area naga */
.glow{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none;
  background:
    radial-gradient(ellipse 34% 30% at 52% 40%,rgba(70,190,255,.55),transparent 70%),
    radial-gradient(ellipse 26% 22% at 78% 78%,rgba(90,210,255,.4),transparent 70%);
  animation:glowpulse 3.2s ease-in-out infinite}
@keyframes glowpulse{0%,100%{opacity:.25;transform:scale(.96)}50%{opacity:.95;transform:scale(1.06)}}

/* Kilatan cahaya menyapu gambar */
.sweep{position:absolute;top:-20%;bottom:-20%;left:0;width:38%;mix-blend-mode:screen;pointer-events:none;
  background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.0) 20%,rgba(190,235,255,.38) 50%,rgba(255,255,255,0) 80%,transparent 100%);
  transform:translateX(-140%) skewX(-18deg);animation:sweep 4.2s cubic-bezier(.45,0,.25,1) 1s infinite}
@keyframes sweep{0%{transform:translateX(-140%) skewX(-18deg)}55%,100%{transform:translateX(330%) skewX(-18deg)}}

/* Vignette lembut agar teks status terbaca */
.vig{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(4,14,34,.55),rgba(4,14,34,0) 28%),radial-gradient(ellipse at 50% 45%,transparent 60%,rgba(4,14,34,.28) 100%)}

canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ===== Status & progres ===== */
.hud{position:absolute;left:16px;bottom:18px;max-width:calc(100% - 32px);padding:9px 14px 10px;border-radius:14px;
  background:rgba(6,20,46,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(140,215,255,.28);box-shadow:0 6px 24px rgba(0,10,40,.35),inset 0 0 18px rgba(76,195,255,.08);
  color:#e8f6ff;animation:hudin .8s cubic-bezier(.2,.8,.2,1) .35s both;transition:border-color .5s,box-shadow .5s}
@keyframes hudin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.txt{font:600 12.5px system-ui,"Segoe UI",sans-serif;letter-spacing:.3px;white-space:nowrap;animation:pulse 1.6s ease-in-out infinite;transition:color .4s}
.sub{display:flex;align-items:center;gap:7px;margin-top:5px;font:500 10.5px system-ui,"Segoe UI",sans-serif;color:#a9dcff;letter-spacing:.35px;white-space:nowrap}
.sub .msg{display:inline-block;transition:opacity .28s,transform .28s}
.sub .msg.out{opacity:0;transform:translateY(-4px)}
.sub .msg.in{opacity:0;transform:translateY(4px)}
.pct{margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums;color:#fff;font-weight:600}
.dots i{display:inline-block;width:3px;height:3px;margin-left:2px;border-radius:50%;background:#7fd6ff;animation:dot 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.spin{width:10px;height:10px;border-radius:50%;border:2px solid rgba(127,214,255,.3);border-top-color:#7fd6ff;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}

.hud.ok{border-color:rgba(120,255,176,.5);box-shadow:0 6px 24px rgba(0,40,20,.35),0 0 22px rgba(80,255,150,.22)}
.hud.ok .txt{color:#8dffbd;animation:none;opacity:1}
.hud.warn{border-color:rgba(255,200,120,.5)}
.hud.warn .txt{color:#ffd08a;animation:none;opacity:1}
.hud.done .spin{border-color:rgba(255,255,255,.25);border-top-color:#fff}

.bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(10,42,82,.35);overflow:hidden}
.fill{position:absolute;inset:0;transform-origin:left center;transform:scaleX(0);
  background:linear-gradient(90deg,#1b8dff,#4cc3ff 60%,#bff0ff);box-shadow:0 0 12px #4cc3ff}
.fill::after{content:"";position:absolute;top:0;bottom:0;width:40%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:run 1.1s ease-in-out infinite}
.hud.ok~.bar .fill{background:linear-gradient(90deg,#19c26b,#6dffb0)}
@keyframes run{0%{left:-40%}100%{left:100%}}
@keyframes in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
</style></head><body>
<div class="card">
  <div class="bg"></div>
  <div class="glow"></div>
  <div class="sweep"></div>
  <div class="vig"></div>
  <canvas id="c"></canvas>
  <div class="hud" id="hud">
    <div class="txt" id="st">Memuat Fotoshop…</div>
    <div class="sub">
      <span class="spin"></span>
      <span class="msg" id="msg">Memuat data</span><span class="dots"><i></i><i></i><i></i></span>
      <span class="pct" id="pct">0%</span>
    </div>
  </div>
  <div class="bar"><div class="fill" id="fill"></div></div>
</div>
<script>
/* ---------- Status (dipanggil dari main.js) ---------- */
const hud = document.getElementById('hud'), st = document.getElementById('st');
const msgEl = document.getElementById('msg');
let finalState = false;
// kind: '' = sedang berjalan | 'ok' | 'warn'
window.setStatus = function(text, kind){
  st.textContent = text;
  hud.className = 'hud' + (kind ? ' ' + kind + ' done' : '');
  if (kind){ finalState = true; target = 100; swapMsg('Membuka Fotoshop'); }
};

/* ---------- Teks kecil "memuat data" yang berganti-ganti ---------- */
const MSGS = ['Memuat data','Menyiapkan kanvas','Memuat kuas & filter','Menyinkronkan pengaturan','Menyiapkan ruang kerja','Hampir selesai'];
let mi = 0;
function swapMsg(t){
  msgEl.classList.add('out');
  setTimeout(() => { msgEl.textContent = t; msgEl.classList.remove('out'); msgEl.classList.add('in');
    requestAnimationFrame(() => requestAnimationFrame(() => msgEl.classList.remove('in'))); }, 280);
}
setInterval(() => { if (finalState) return; mi = (mi + 1) % MSGS.length; if (mi === 0) mi = 1; swapMsg(MSGS[mi]); }, 1100);

/* ---------- Progress bar & persen (naik halus, tuntas saat status akhir) ---------- */
const fill = document.getElementById('fill'), pctEl = document.getElementById('pct');
let prog = 0, target = 90;
function stepProg(){
  prog += (target - prog) * (finalState ? 0.12 : 0.012) + (finalState ? 0.15 : 0.02);
  if (prog > target) prog = target;
  fill.style.transform = 'scaleX(' + (prog/100) + ')';
  pctEl.textContent = Math.round(prog) + '%';
}

/* ---------- Gambar splash hasil update (jika ada) ---------- */
(function(){
  const img = new URLSearchParams(location.search).get('img');
  if (!img) return;
  const t = new Image();
  t.onload = () => { document.querySelector('.bg').style.backgroundImage = 'url("' + img + '")'; };
  t.src = img;
})();

/* ---------- Partikel: bara energi, kilau bintang, riak air ---------- */
const c = document.getElementById('c'), x = c.getContext('2d');
let W, H; const dpr = window.devicePixelRatio || 1;
function size(){ W = c.clientWidth; H = c.clientHeight; c.width = W*dpr; c.height = H*dpr; x.setTransform(dpr,0,0,dpr,0,0); }
size();

// Bara: melayang naik ke kanan-atas mengikuti arah "angin", dengan ekor
function mkEmber(init){
  const big = Math.random() < .18;
  return { x: init ? Math.random()*W : -10 + Math.random()*W*0.6, y: init ? Math.random()*H : H*(0.6 + Math.random()*0.5),
           r: big ? 1.8 + Math.random()*1.6 : 0.7 + Math.random()*1.3,
           vx: 0.5 + Math.random()*1.1, vy: -(0.4 + Math.random()*1.1),
           a: 0.45 + Math.random()*0.55, ph: Math.random()*6.28, f: 0.8 + Math.random()*1.6, life: 0 };
}
const E = Array.from({length: 85}, () => mkEmber(true));

// Kilau bintang 4 sisi yang berkedip
const S = Array.from({length: 14}, () => ({ x: Math.random()*W, y: Math.random()*H*0.85, s: 3 + Math.random()*6, ph: Math.random()*6.28, sp: 0.8 + Math.random()*1.6 }));

// Riak air di bagian bawah
const R = [];
function addRipple(){ R.push({ x: W*(0.25 + Math.random()*0.7), y: H*(0.9 + Math.random()*0.08), r: 4, a: .5 }); }
setInterval(addRipple, 420);

function star(px, py, s, a){
  x.save(); x.translate(px, py); x.globalAlpha = a;
  x.fillStyle = 'rgba(220,245,255,1)';
  x.beginPath();
  x.moveTo(0,-s); x.quadraticCurveTo(s*.12,-s*.12,s,0); x.quadraticCurveTo(s*.12,s*.12,0,s);
  x.quadraticCurveTo(-s*.12,s*.12,-s,0); x.quadraticCurveTo(-s*.12,-s*.12,0,-s); x.fill();
  x.restore();
}

(function loop(t){
  x.clearRect(0,0,W,H);
  x.globalCompositeOperation = 'lighter';

  for (const p of E){
    const px = p.x, py = p.y;
    p.x += p.vx + Math.sin(t/600*p.f + p.ph)*0.6;
    p.y += p.vy + Math.cos(t/800*p.f + p.ph)*0.35;
    if (p.x > W + 20 || p.y < -20) Object.assign(p, mkEmber(false));
    const tw = 0.6 + 0.4*Math.sin(t/180*p.f + p.ph);
    // ekor
    x.strokeStyle = 'rgba(110,210,255,' + (p.a*0.35*tw) + ')'; x.lineWidth = p.r*0.9; x.lineCap = 'round';
    x.beginPath(); x.moveTo(px - p.vx*5, py - p.vy*5); x.lineTo(p.x, p.y); x.stroke();
    // inti bercahaya
    const g = x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);
    g.addColorStop(0, 'rgba(210,245,255,' + (p.a*tw) + ')'); g.addColorStop(.35, 'rgba(90,205,255,' + (p.a*tw*.5) + ')'); g.addColorStop(1, 'rgba(76,195,255,0)');
    x.fillStyle = g; x.beginPath(); x.arc(p.x,p.y,p.r*5,0,6.283); x.fill();
  }

  for (const s of S){
    const a = Math.max(0, Math.sin(t/1000*s.sp + s.ph));
    if (a > .02) star(s.x, s.y, s.s*a, a*.9);
  }

  x.globalCompositeOperation = 'source-over';
  for (let i = R.length - 1; i >= 0; i--){
    const r = R[i]; r.r += 0.9; r.a -= 0.008;
    if (r.a <= 0){ R.splice(i,1); continue; }
    x.strokeStyle = 'rgba(190,240,255,' + r.a + ')'; x.lineWidth = 1;
    x.beginPath(); x.ellipse(r.x, r.y, r.r*2.4, r.r*0.45, 0, 0, 6.283); x.stroke();
  }

  stepProg();
  requestAnimationFrame(loop);
})(0);
</script>
</body></html>
